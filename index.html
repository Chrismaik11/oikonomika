<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a1a1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Οικονομικά">
<title>Οικονομικά Επιχειρήσεων</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://apis.google.com/js/api.js" async defer></script>
<style>
:root {
  --bg: #f7f5f0;
  --surface: #ffffff;
  --surface-2: #efece5;
  --ink: #1a1a1a;
  --ink-2: #5a5a55;
  --ink-3: #9a9a93;
  --line: #e5e1d6;
  --accent: #d97706;
  --accent-dark: #92400e;
  --green: #15803d;
  --green-bg: #dcfce7;
  --red: #b91c1c;
  --red-bg: #fee2e2;
  --blue: #1d4ed8;
  --blue-bg: #dbeafe;
  --amber: #b45309;
  --amber-bg: #fef3c7;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.06);
  --radius: 14px;
  --radius-sm: 10px;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f0f0e;
    --surface: #1c1c1a;
    --surface-2: #262624;
    --ink: #f5f3ee;
    --ink-2: #b0aea6;
    --ink-3: #6b6963;
    --line: #2e2e2b;
    --accent: #f59e0b;
    --accent-dark: #fbbf24;
    --green: #4ade80;
    --green-bg: #14532d33;
    --red: #f87171;
    --red-bg: #7f1d1d33;
    --blue: #60a5fa;
    --blue-bg: #1e3a8a33;
    --amber: #fbbf24;
    --amber-bg: #78350f33;
  }
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
body {
  font-family: 'Plus Jakarta Sans', -apple-system, system-ui, sans-serif;
  background: var(--bg);
  color: var(--ink);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  display: flex;
  flex-direction: column;
}

.app-header {
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  padding-top: max(env(safe-area-inset-top), 14px);
  padding-left: 16px;
  padding-right: 16px;
  padding-bottom: 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
  gap: 10px;
}
.app-title {
  font-size: 17px;
  font-weight: 700;
  letter-spacing: -0.3px;
  display: flex;
  align-items: center;
  gap: 8px;
  flex: 1;
  min-width: 0;
}
.app-title-dot {
  width: 10px;
  height: 10px;
  background: var(--accent);
  border-radius: 50%;
  flex-shrink: 0;
}
.app-title span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.header-actions { display: flex; gap: 4px; align-items: center; flex-shrink: 0; }
.header-btn {
  width: 36px; height: 36px;
  border: none;
  background: transparent;
  border-radius: 10px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--ink-2);
  transition: background 0.15s;
  position: relative;
}
.header-btn:active { background: var(--surface-2); }
.header-btn svg { width: 20px; height: 20px; }

.sync-indicator {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  font-weight: 600;
  padding: 5px 9px;
  border-radius: 12px;
  background: var(--surface-2);
  color: var(--ink-2);
  cursor: pointer;
  border: none;
  font-family: inherit;
}
.sync-indicator.synced { background: var(--green-bg); color: var(--green); }
.sync-indicator.syncing { background: var(--blue-bg); color: var(--blue); }
.sync-indicator.pending { background: var(--amber-bg); color: var(--amber); }
.sync-indicator.offline { background: var(--red-bg); color: var(--red); }
.sync-indicator .dot-sync {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: currentColor;
}
.sync-indicator.syncing .dot-sync { animation: pulse 1s ease infinite; }
@keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.3;} }

main {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  padding-bottom: 80px;
}
.tab-content { padding: 16px; max-width: 720px; margin: 0 auto; }

.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0; right: 0;
  background: var(--surface);
  border-top: 1px solid var(--line);
  padding: 6px 0 max(env(safe-area-inset-bottom), 6px);
  display: flex;
  z-index: 10;
}
.nav-item {
  flex: 1;
  border: none;
  background: transparent;
  padding: 8px 4px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  cursor: pointer;
  color: var(--ink-3);
  font-family: inherit;
  font-size: 11px;
  font-weight: 500;
  transition: color 0.15s;
}
.nav-item svg { width: 22px; height: 22px; }
.nav-item.active { color: var(--accent); }
.nav-item.add-btn { color: var(--ink-2) !important; position: relative; }
.nav-item.add-btn .nav-icon-wrap {
  width: 48px; height: 48px;
  background: var(--accent);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  margin-bottom: 2px;
  box-shadow: 0 4px 12px rgba(217, 119, 6, 0.35);
}
.nav-item.add-btn .nav-icon-wrap svg { width: 26px; height: 26px; }

.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 18px;
  margin-bottom: 12px;
}
.card-tight { padding: 14px 16px; }

.section-title {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: var(--ink-3);
  margin: 22px 4px 10px;
}
.section-title:first-child { margin-top: 6px; }
.bank-section-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.bank-section-actions {
  display: flex;
  gap: 4px;
  align-items: center;
}
.btn-icon-mini {
  width: 30px;
  height: 30px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink-2);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  padding: 0;
}
.btn-icon-mini:hover { background: var(--surface-2); color: var(--ink); }
.btn-icon-mini svg { width: 16px; height: 16px; }
.empty-mini {
  padding: 20px 16px;
  text-align: center;
  color: var(--ink-3);
  font-size: 13px;
}
.empty-mini p { margin: 0 0 8px; }
.btn-link {
  background: none;
  border: none;
  color: var(--accent);
  font-weight: 600;
  cursor: pointer;
  font-size: 13px;
  font-family: inherit;
  padding: 4px 8px;
}
.btn-link:hover { text-decoration: underline; }
.payment-method-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin: 8px 0 12px;
}
.payment-method-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  padding: 12px 8px;
  border: 1.5px solid var(--line);
  border-radius: var(--radius-sm);
  background: var(--surface);
  cursor: pointer;
  font-family: inherit;
  font-size: 12px;
  font-weight: 600;
  color: var(--ink-2);
}
.payment-method-btn svg { width: 20px; height: 20px; }
.payment-method-btn.active {
  border-color: var(--accent);
  background: var(--accent);
  color: white;
}
.bank-select-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 6px;
  margin-top: 8px;
}
.bank-select-option {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border: 1.5px solid var(--line);
  border-radius: var(--radius-sm);
  background: var(--surface);
  cursor: pointer;
  font-family: inherit;
  text-align: left;
  width: 100%;
}
.bank-select-option.active { border-color: var(--accent); background: var(--surface-2); }
.bank-select-option-icon {
  width: 32px;
  height: 32px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.bank-select-option-icon svg { width: 18px; height: 18px; }
.bank-select-option-text { flex: 1; min-width: 0; }
.bank-select-option-name { font-weight: 600; font-size: 14px; color: var(--ink); }
.bank-select-option-sub { font-size: 11px; color: var(--ink-3); }
.kind-toggle {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 12px;
}
.kind-toggle-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 12px;
  border: 1.5px solid var(--line);
  border-radius: var(--radius-sm);
  background: var(--surface);
  cursor: pointer;
  font-family: inherit;
  font-size: 14px;
  font-weight: 600;
  color: var(--ink-2);
}
.kind-toggle-btn svg { width: 18px; height: 18px; }
.kind-toggle-btn.active {
  border-color: var(--accent);
  background: var(--accent);
  color: white;
}
.form-hint {
  font-size: 11px;
  color: var(--ink-3);
  margin-top: -8px;
  margin-bottom: 14px;
}

.balance-hero {
  background: linear-gradient(135deg, var(--ink) 0%, #2a2a28 100%);
  color: #f5f3ee;
  border-radius: var(--radius);
  padding: 22px 20px;
  margin-bottom: 12px;
  position: relative;
  overflow: hidden;
}
@media (prefers-color-scheme: dark) {
  .balance-hero { background: linear-gradient(135deg, #2a2a28 0%, #1a1a18 100%); }
}
.balance-hero::after {
  content: '';
  position: absolute;
  top: -50px; right: -50px;
  width: 200px; height: 200px;
  background: radial-gradient(circle, rgba(217, 119, 6, 0.15) 0%, transparent 70%);
  border-radius: 50%;
}
.balance-label {
  font-size: 12px;
  font-weight: 500;
  color: rgba(245, 243, 238, 0.65);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 4px;
}
.balance-amount {
  font-size: 36px;
  font-weight: 700;
  letter-spacing: -1.2px;
  line-height: 1.1;
  margin-bottom: 14px;
}
.balance-amount.negative { color: #fca5a5; }
.balance-split {
  display: flex;
  gap: 14px;
  position: relative;
  z-index: 1;
}
.balance-split-item {
  flex: 1;
  background: rgba(255,255,255,0.06);
  padding: 10px 12px;
  border-radius: var(--radius-sm);
}
.balance-split-label {
  font-size: 11px;
  color: rgba(245, 243, 238, 0.65);
  margin-bottom: 2px;
}
.balance-split-value {
  font-size: 16px;
  font-weight: 600;
  letter-spacing: -0.3px;
}
.balance-split-value.in { color: #86efac; }
.balance-split-value.out { color: #fca5a5; }

.period-picker {
  display: flex;
  gap: 4px;
  background: var(--surface-2);
  padding: 4px;
  border-radius: var(--radius-sm);
  margin-bottom: 12px;
}
.period-btn {
  flex: 1;
  padding: 8px;
  border: none;
  background: transparent;
  font-size: 13px;
  font-weight: 600;
  color: var(--ink-2);
  border-radius: 7px;
  cursor: pointer;
  font-family: inherit;
}
.period-btn.active {
  background: var(--surface);
  color: var(--ink);
  box-shadow: var(--shadow-sm);
}

.list-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 0;
  border-bottom: 1px solid var(--line);
  cursor: pointer;
}
.list-row:last-child { border-bottom: none; }
.list-row:first-child { padding-top: 4px; }
.list-row:active { background: var(--surface-2); }

.row-icon {
  width: 40px; height: 40px;
  border-radius: 11px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.row-icon svg { width: 20px; height: 20px; }
.row-main { flex: 1; min-width: 0; }
.row-title {
  font-weight: 600;
  font-size: 14.5px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.row-sub {
  font-size: 12.5px;
  color: var(--ink-2);
  margin-top: 1px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.row-amount {
  font-weight: 600;
  font-size: 14.5px;
  letter-spacing: -0.2px;
  white-space: nowrap;
}
.row-amount.in { color: var(--green); }
.row-amount.out { color: var(--red); }

.form-label {
  font-size: 12px;
  font-weight: 600;
  color: var(--ink-2);
  text-transform: uppercase;
  letter-spacing: 0.4px;
  margin-bottom: 6px;
  display: block;
}
.form-input, .form-select {
  width: 100%;
  padding: 13px 14px;
  background: var(--surface);
  border: 1.5px solid var(--line);
  border-radius: var(--radius-sm);
  font-family: inherit;
  font-size: 15px;
  color: var(--ink);
  margin-bottom: 14px;
  -webkit-appearance: none;
  appearance: none;
}
.form-input:focus, .form-select:focus {
  outline: none;
  border-color: var(--accent);
}
.form-select {
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path fill='%239a9a93' d='M6 8L0 0h12z'/></svg>");
  background-repeat: no-repeat;
  background-position: right 16px center;
  padding-right: 38px;
}

.amount-input {
  font-size: 32px;
  font-weight: 700;
  letter-spacing: -1px;
  padding: 18px 14px;
  text-align: center;
}

.type-toggle {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 18px;
}
.type-btn {
  padding: 14px;
  border: 1.5px solid var(--line);
  background: var(--surface);
  border-radius: var(--radius-sm);
  font-family: inherit;
  font-size: 14px;
  font-weight: 600;
  color: var(--ink-2);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}
.type-btn svg { width: 18px; height: 18px; }
.type-btn.active-in { background: var(--green-bg); border-color: var(--green); color: var(--green); }
.type-btn.active-out { background: var(--red-bg); border-color: var(--red); color: var(--red); }

.btn-primary {
  width: 100%;
  padding: 15px;
  background: var(--ink);
  color: var(--bg);
  border: none;
  border-radius: var(--radius-sm);
  font-family: inherit;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}
.btn-primary:active { opacity: 0.85; }
.btn-primary svg { width: 18px; height: 18px; }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

.btn-secondary {
  width: 100%;
  padding: 13px;
  background: var(--surface);
  color: var(--ink);
  border: 1.5px solid var(--line);
  border-radius: var(--radius-sm);
  font-family: inherit;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}
.btn-secondary svg { width: 17px; height: 17px; }

.btn-danger-ghost {
  background: transparent;
  color: var(--red);
  border: none;
  padding: 6px 10px;
  font-family: inherit;
  font-size: 13px;
  cursor: pointer;
  border-radius: 8px;
}
.btn-danger-ghost svg { width: 18px; height: 18px; }
.btn-danger-ghost:active { background: var(--red-bg); }

.empty {
  text-align: center;
  padding: 36px 20px;
  color: var(--ink-3);
}
.empty svg {
  width: 38px; height: 38px;
  margin: 0 auto 10px;
  opacity: 0.5;
  display: block;
}
.empty p { margin: 4px 0; font-size: 14px; }

.stats-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 12px;
}
.stat-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 14px;
}
.stat-label {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.4px;
  color: var(--ink-3);
  margin-bottom: 4px;
}
.stat-value {
  font-size: 18px;
  font-weight: 700;
  letter-spacing: -0.4px;
}
.stat-value.in { color: var(--green); }
.stat-value.out { color: var(--red); }

.bar-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
  font-size: 13px;
}
.bar-row:last-child { margin-bottom: 4px; }
.bar-label {
  flex: 0 0 100px;
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  font-size: 13px;
}
.bar-track {
  flex: 1;
  height: 10px;
  background: var(--surface-2);
  border-radius: 5px;
  overflow: hidden;
}
.bar-fill { height: 100%; border-radius: 5px; transition: width 0.3s; }
.bar-value {
  flex: 0 0 80px;
  text-align: right;
  font-weight: 600;
  font-size: 13px;
}

.account-row-compare { margin-bottom: 16px; }
.account-row-compare:last-child { margin-bottom: 0; }
.account-row-compare-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
}
.account-row-compare-name {
  font-weight: 600;
  font-size: 14px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.dot { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
.account-row-compare-balance {
  font-weight: 700;
  font-size: 14px;
}

.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 100;
  display: flex;
  align-items: flex-end;
  animation: fade-in 0.2s;
}
@keyframes fade-in { from {opacity: 0;} to {opacity: 1;} }
@keyframes slide-up { from {transform: translateY(100%);} to {transform: translateY(0);} }
.modal {
  background: var(--surface);
  width: 100%;
  max-width: 720px;
  margin: 0 auto;
  border-radius: var(--radius) var(--radius) 0 0;
  padding: 20px 18px max(env(safe-area-inset-bottom), 18px);
  max-height: 90vh;
  overflow-y: auto;
  animation: slide-up 0.25s cubic-bezier(0.32, 0.72, 0, 1);
}
.modal-title {
  font-size: 18px;
  font-weight: 700;
  margin: 0 0 16px;
  letter-spacing: -0.3px;
}
.modal-actions {
  display: flex;
  gap: 10px;
  margin-top: 6px;
}
.modal-actions > * { flex: 1; }

.color-grid {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 14px;
}
.color-swatch {
  width: 38px; height: 38px;
  border-radius: 10px;
  border: 3px solid transparent;
  cursor: pointer;
}
.color-swatch.selected {
  border-color: var(--ink);
  transform: scale(1.05);
}

.toast {
  position: fixed;
  bottom: 90px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--ink);
  color: var(--bg);
  padding: 11px 18px;
  border-radius: 22px;
  font-size: 13px;
  font-weight: 500;
  z-index: 200;
  animation: toast-pop 2.5s ease;
  box-shadow: var(--shadow-md);
  white-space: nowrap;
  max-width: 90%;
}
@keyframes toast-pop {
  0% { opacity: 0; transform: translate(-50%, 20px); }
  10%, 85% { opacity: 1; transform: translate(-50%, 0); }
  100% { opacity: 0; transform: translate(-50%, -10px); }
}

.filter-pills {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding-bottom: 10px;
  margin: 0 -16px 6px;
  padding-left: 16px;
  padding-right: 16px;
  scrollbar-width: none;
}
.filter-pills::-webkit-scrollbar { display: none; }
.filter-pill {
  padding: 7px 14px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 18px;
  font-family: inherit;
  font-size: 13px;
  font-weight: 500;
  color: var(--ink-2);
  cursor: pointer;
  white-space: nowrap;

    {id:'cat_i_4', name:'Άλλα έσοδα', color:'#0d9488'}

};

// ============ STATE ============
const STORAGE_KEY = 'finance_app_v2';
const TOKEN_KEY = 'finance_app_gtoken';

const BANK_HIDDEN_KEY = 'finance_app_bank_hidden';
const BANK_COLORS = ['#1d4ed8','#7c3aed','#15803d','#dc2626','#db2777','#0d9488','#d97706','#525252'];

let state = {
  accounts: [],
  banks: [],
  transactions: [],
  categories: JSON.parse(JSON.stringify(DEFAULT_CATEGORIES)),
  ui: {
    activeTab: 'dashboard',
    activePeriod: 'month',
    filterAccount: 'all',
    filterType: 'all',
    searchQuery: '',
    modal: null,
    editTx: null,
    banksHidden: false
  },
  form: { type: 'expense', accountId: '', categoryId: '', amount: '', note: '', date: todayISO(), paymentMethod: 'cash', bankId: '' },
  sync: {
    status: 'offline', // offline | syncing | synced | pending | error
    lastSync: null,
    isSignedIn: false,
    userEmail: null,
    fileId: null,
    pendingChanges: 0,
    error: null
  }
};

let tokenClient = null;
let gapiInited = false;
let gisInited = false;
let syncTimeout = null;

function todayISO() { return new Date().toISOString().slice(0,10); }
function uid() { return 'id_' + Date.now() + '_' + Math.random().toString(36).slice(2,8); }
function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtMoney(n) {
  return new Intl.NumberFormat('el-GR', {style:'currency', currency:'EUR', minimumFractionDigits:2, maximumFractionDigits:2}).format(Math.round(n*100)/100);
}
function fmtDate(d) {
  return new Date(d).toLocaleDateString('el-GR', {day:'2-digit', month:'2-digit', year:'numeric'});
}
function fmtDateShort(d) {
  return new Date(d).toLocaleDateString('el-GR', {day:'2-digit', month:'short'});
}
function fmtTimeAgo(iso) {
  if (!iso) return 'ποτέ';
  const diff = (Date.now() - new Date(iso).getTime()) / 1000;
  if (diff < 60) return 'μόλις τώρα';
  if (diff < 3600) return Math.floor(diff/60) + ' λ. πριν';
  if (diff < 86400) return Math.floor(diff/3600) + ' ώ. πριν';
  return Math.floor(diff/86400) + ' μέρες πριν';
}

// ============ LOCAL STORAGE ============
function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const saved = JSON.parse(raw);
      state.accounts = saved.accounts || [];
      state.banks = saved.banks || [];
      state.transactions = saved.transactions || [];
      if (saved.categories) state.categories = saved.categories;
    }
  } catch(e) { console.warn('Load error:', e); }
  
  state.sync.fileId = localStorage.getItem(FILE_ID_KEY);
  state.sync.lastSync = localStorage.getItem(LAST_SYNC_KEY);
  state.sync.pendingChanges = parseInt(localStorage.getItem('finance_app_pending') || '0', 10);
  state.ui.banksHidden = localStorage.getItem(BANK_HIDDEN_KEY) === '1';
  
  if (state.accounts.length === 0) {
    state.accounts = [{id:'acc_personal', name:'Προσωπικά', color:'#525252', isPersonal:true}];
  }
}

function saveLocal() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      accounts: state.accounts,
      banks: state.banks,
      transactions: state.transactions,
      categories: state.categories,
      version: 4
    }));
  } catch(e) { console.error('Save error:', e); }
}

function markPending() {
  state.sync.pendingChanges++;
  localStorage.setItem('finance_app_pending', String(state.sync.pendingChanges));
  if (state.sync.isSignedIn) {
    state.sync.status = 'pending';
    updateSyncIndicator();
    scheduleSync();
  }
}

function scheduleSync() {
  if (syncTimeout) clearTimeout(syncTimeout);
  syncTimeout = setTimeout(() => syncToDrive(), 1500);
}

// ============ GOOGLE DRIVE SYNC ============
function gapiLoad() {
  gapi.load('client', async () => {
    try {
      await gapi.client.init({ discoveryDocs: ['https://www.googleapis.com/discovery/v1/apis/drive/v3/rest'] });
      gapiInited = true;
      maybeRestoreSession();
    } catch(e) { console.error('GAPI init error:', e); }
  });
}

function gisLoad() {
  try {
    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: GOOGLE_CLIENT_ID,
      scope: SCOPES,
      callback: (resp) => {
        if (resp.error) {
          state.sync.error = resp.error;
          state.sync.status = 'error';
          updateSyncIndicator();
          return;
        }
        localStorage.setItem(TOKEN_KEY, JSON.stringify({
          access_token: resp.access_token,
          expires_at: Date.now() + (resp.expires_in * 1000)
        }));
        state.sync.isSignedIn = true;
        onSignedIn();
      }
    });
    gisInited = true;
    maybeRestoreSession();
  } catch(e) { console.error('GIS init error:', e); }
}

function maybeRestoreSession() {
  if (!gapiInited || !gisInited) return;
  const tokenData = localStorage.getItem(TOKEN_KEY);
  if (!tokenData) return;
  try {
    const t = JSON.parse(tokenData);
    if (t.expires_at > Date.now() + 60000) {
      gapi.client.setToken({ access_token: t.access_token });
      state.sync.isSignedIn = true;
      onSignedIn();
    } else {
      // Token expired - request silent refresh
      requestToken(true);
    }
  } catch(e) {}
}

function requestToken(silent) {
  if (!tokenClient) { showToast('Συνδέθηκα ακόμα στο Google...'); return; }
  tokenClient.requestAccessToken({ prompt: silent ? '' : 'consent' });
}

async function signIn() {
  if (!gisInited) { showToast('Φόρτωση Google...'); return; }
  requestToken(false);
}

function signOut() {
  if (!confirm('Αποσύνδεση από Google Drive;\n\nΤα τοπικά δεδομένα παραμένουν.')) return;
  const token = gapi.client.getToken();
  if (token) {
    google.accounts.oauth2.revoke(token.access_token, () => {});
    gapi.client.setToken(null);
  }
  localStorage.removeItem(TOKEN_KEY);
  state.sync.isSignedIn = false;
  state.sync.userEmail = null;
  state.sync.status = 'offline';
  updateSyncIndicator();
  render();
  showToast('Αποσυνδέθηκες');
}

async function onSignedIn() {
  state.sync.status = 'syncing';
  updateSyncIndicator();
  
  try {
    // Find or create file
    if (!state.sync.fileId) {
      const list = await gapi.client.drive.files.list({
        q: `name='${DRIVE_FILE_NAME}' and trashed=false`,
        spaces: 'drive',
        fields: 'files(id, name, modifiedTime)'
      });
      if (list.result.files && list.result.files.length > 0) {
        state.sync.fileId = list.result.files[0].id;
        localStorage.setItem(FILE_ID_KEY, state.sync.fileId);
      }
    }
    
    // Decide: pull from Drive or push to Drive?
    if (state.sync.fileId) {
      // File exists in Drive
      const meta = await gapi.client.drive.files.get({
        fileId: state.sync.fileId,
        fields: 'modifiedTime'
      });
      const driveTime = new Date(meta.result.modifiedTime).getTime();
      const localTime = state.sync.lastSync ? new Date(state.sync.lastSync).getTime() : 0;
      
      if (state.sync.pendingChanges > 0 && localTime > 0 && driveTime <= localTime + 5000) {
        // Local is newer - push
        await syncToDrive();
      } else if (driveTime > localTime + 5000) {
        // Drive is newer - check for conflicts
        if (state.sync.pendingChanges > 0) {
          // Conflict: pending local changes AND newer drive version
          const choice = confirm(
            'ΣΥΓΚΡΟΥΣΗ ΔΕΔΟΜΕΝΩΝ\n\n' +
            'Υπάρχουν αλλαγές που δεν συγχρονίστηκαν, αλλά το αρχείο στο Drive είναι νεότερο.\n\n' +
            'OK = Κρατάμε τις τοπικές αλλαγές (θα γραφτούν στο Drive)\n' +
            'Άκυρο = Φορτώνουμε από Drive (οι τοπικές αλλαγές χάνονται)'
          );
          if (choice) {
            await syncToDrive();
          } else {
            await syncFromDrive();
          }
        } else {
          await syncFromDrive();
        }
      } else {
        // In sync
        state.sync.status = 'synced';
        updateSyncIndicator();
      }
    } else {
      // No file in Drive - create it
      await syncToDrive();
    }
  } catch(e) {
    console.error('Sync error:', e);
    state.sync.status = 'error';
    state.sync.error = e.message;
    updateSyncIndicator();
  }
  render();
}

async function syncToDrive() {
  if (!state.sync.isSignedIn) return;
  
  state.sync.status = 'syncing';
  updateSyncIndicator();
  
  try {
    const content = JSON.stringify({
      accounts: state.accounts,
      banks: state.banks,
      transactions: state.transactions,
      categories: state.categories,
      version: 4,
      lastModified: new Date().toISOString()
    }, null, 2);
    
    const metadata = {
      name: DRIVE_FILE_NAME,
      mimeType: 'application/json'
    };
    
    const boundary = '-------314159265358979323846';
    const delimiter = "\r\n--" + boundary + "\r\n";
    const closeDelim = "\r\n--" + boundary + "--";
    
    const multipartBody = 
      delimiter +
      'Content-Type: application/json; charset=UTF-8\r\n\r\n' +
      JSON.stringify(metadata) +
      delimiter +
      'Content-Type: application/json\r\n\r\n' +
      content +
      closeDelim;
    
    const path = state.sync.fileId 
      ? `/upload/drive/v3/files/${state.sync.fileId}?uploadType=multipart`
      : '/upload/drive/v3/files?uploadType=multipart';
    const method = state.sync.fileId ? 'PATCH' : 'POST';
    
    const resp = await gapi.client.request({
      path: path,
      method: method,
      params: { uploadType: 'multipart' },
      headers: { 'Content-Type': 'multipart/related; boundary="' + boundary + '"' },
      body: multipartBody
    });
    
    if (!state.sync.fileId) {
      state.sync.fileId = resp.result.id;
      localStorage.setItem(FILE_ID_KEY, state.sync.fileId);
    }
    
    state.sync.lastSync = new Date().toISOString();
    localStorage.setItem(LAST_SYNC_KEY, state.sync.lastSync);
    state.sync.pendingChanges = 0;
    localStorage.setItem('finance_app_pending', '0');
    state.sync.status = 'synced';
    updateSyncIndicator();
  } catch(e) {
    console.error('Upload error:', e);
    state.sync.status = 'error';
    state.sync.error = e.message || 'Σφάλμα ανεβάσματος';
    updateSyncIndicator();
  }
}

async function syncFromDrive() {
  if (!state.sync.isSignedIn || !state.sync.fileId) return;
  
  state.sync.status = 'syncing';
  updateSyncIndicator();
  
  try {
    const resp = await gapi.client.drive.files.get({
      fileId: state.sync.fileId,
      alt: 'media'
    });
    
    const data = typeof resp.result === 'string' ? JSON.parse(resp.result) : resp.result;
    
    if (data.accounts) state.accounts = data.accounts;
    if (data.banks) state.banks = data.banks;
    if (data.transactions) state.transactions = data.transactions;
    if (data.categories) state.categories = data.categories;
    
    saveLocal();
    state.sync.lastSync = new Date().toISOString();
    localStorage.setItem(LAST_SYNC_KEY, state.sync.lastSync);
    state.sync.pendingChanges = 0;
    localStorage.setItem('finance_app_pending', '0');
    state.sync.status = 'synced';
    updateSyncIndicator();
    render();
    showToast('Φορτώθηκε από Drive');
  } catch(e) {
    console.error('Download error:', e);
    state.sync.status = 'error';
    updateSyncIndicator();
  }
}

function updateSyncIndicator() {
  const btn = document.getElementById('sync-btn');
  const text = document.getElementById('sync-text');
  if (!btn) return;
  
  btn.classList.remove('synced', 'syncing', 'pending', 'offline');
  
  if (!state.sync.isSignedIn) {
    btn.classList.add('offline');
    text.textContent = 'Σύνδεση';
    btn.title = 'Συνδέσου με Google Drive';
  } else if (state.sync.status === 'syncing') {
    btn.classList.add('syncing');
    text.textContent = 'Sync...';
  } else if (state.sync.status === 'pending') {
    btn.classList.add('pending');
    text.textContent = state.sync.pendingChanges + ' νέες';
  } else if (state.sync.status === 'synced') {
    btn.classList.add('synced');
    text.textContent = '✓ Sync';
  } else if (state.sync.status === 'error') {
    btn.classList.add('offline');
    text.textContent = 'Σφάλμα';
  } else {
    btn.classList.add('offline');
    text.textContent = 'Offline';
  }
}

// ============ DATA HELPERS ============
function saveState() {
  saveLocal();
  markPending();
}

function getPeriodTx(period, accountId) {
  const now = new Date();
  return state.transactions.filter(t => {
    if (accountId && accountId !== 'all' && t.accountId !== accountId) return false;
    const td = new Date(t.date);
    if (period === 'day') return td.toDateString() === now.toDateString();
    if (period === 'week') {
      const weekAgo = new Date(); weekAgo.setDate(now.getDate() - 7);
      return td >= weekAgo;
    }
    if (period === 'month') return td.getMonth() === now.getMonth() && td.getFullYear() === now.getFullYear();
    if (period === 'year') return td.getFullYear() === now.getFullYear();
    return true;
  });
}

function getAccount(id) { return state.accounts.find(a => a.id === id); }
function getCategory(type, id) { return (state.categories[type] || []).find(c => c.id === id); }
function getBank(id) { return state.banks.find(b => b.id === id); }
function getBankBalance(bankId) {
  const bank = getBank(bankId);
  if (!bank) return 0;
  let balance = bank.initialBalance || 0;
  state.transactions.forEach(t => {
    if (t.bankId === bankId) {
      balance += (t.type === 'income' ? t.amount : -t.amount);
    }
  });
  return balance;
}
function getCashBalance() {
  let balance = 0;
  state.transactions.forEach(t => {
    if (!t.bankId && (!t.paymentMethod || t.paymentMethod === 'cash')) {
      balance += (t.type === 'income' ? t.amount : -t.amount);
    }
  });
  return balance;
}
function maskAmount(amount) {
  return state.ui.banksHidden ? '••••••' : fmtMoney(amount);
}

function searchTransactions(query) {
  if (!query || !query.trim()) return state.transactions;
  const q = query.toLowerCase().trim();
  const qNum = parseFloat(q.replace(',', '.'));
  
  return state.transactions.filter(t => {
    const acc = getAccount(t.accountId);
    const cat = getCategory(t.type, t.categoryId);
    
    if ((t.note || '').toLowerCase().includes(q)) return true;
    if (acc && acc.name.toLowerCase().includes(q)) return true;
    if (cat && cat.name.toLowerCase().includes(q)) return true;
    if (!isNaN(qNum) && Math.abs(t.amount - qNum) < 0.01) return true;
    if (t.date.includes(q)) return true;
    if (fmtDate(t.date).includes(q)) return true;
    
    return false;
  });
}

function highlightMatch(text, query) {
  if (!query || !query.trim()) return escapeHtml(text);
  const escaped = escapeHtml(text);
  const q = query.trim();
  const regex = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
  return escaped.replace(regex, '<mark>$1</mark>');
}

function renderTxRow(t, highlight) {
  const acc = getAccount(t.accountId);
  const cat = getCategory(t.type, t.categoryId);
  const q = highlight || '';
  
  const noteHtml = t.note ? ' · <span style="font-weight:400;color:var(--ink-2)">' + highlightMatch(t.note, q) + '</span>' : '';
  const catName = highlightMatch(cat?.name || '—', q);
  const accName = highlightMatch(acc?.name || '—', q);
  
  // Payment method indicator
  let methodHtml = '';
  if (t.bankId) {
    const bank = getBank(t.bankId);
    if (bank) {
      methodHtml = ` · <span style="color:${bank.color};font-weight:600">${escapeHtml(bank.name)}</span>`;
    }
  }
  
  return `
    <div class="list-row" onclick="editTransaction('${t.id}')">
      <div class="row-icon" style="background:${(cat?.color || '#888')}22;color:${cat?.color || '#888'}">
        ${t.type === 'income' ? ICONS.arrowDown : ICONS.arrowUp}
      </div>
      <div class="row-main">
        <div class="row-title">${catName}${noteHtml}</div>
        <div class="row-sub">${accName} · ${fmtDateShort(t.date)}${methodHtml}</div>
      </div>
      <div class="row-amount ${t.type === 'income' ? 'in' : 'out'}">${t.type === 'expense' ? '−' : '+'}${fmtMoney(t.amount)}</div>
    </div>
  `;
}

  let baseList = state.ui.searchQuery 
    ? searchTransactions(state.ui.searchQuery)
    : state.transactions;
  
  let filtered = baseList.filter(t => {
    if (state.ui.filterAccount !== 'all' && t.accountId !== state.ui.filterAccount) return false;
    if (state.ui.filterType !== 'all' && t.type !== state.ui.filterType) return false;
    return true;
  }).sort((a,b) => new Date(b.date) - new Date(a.date));
  
  const totalIncome = filtered.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0);
  const totalExpense = filtered.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);
  
  const groups = {};
  filtered.forEach(t => {
    if (!groups[t.date]) groups[t.date] = [];
    groups[t.date].push(t);
  });
  
  let listHtml = '';
  if (filtered.length === 0) {
    listHtml = `<div class="card"><div class="empty">${ICONS.emptyBox}<p>${state.ui.searchQuery ? 'Δεν βρέθηκαν αποτελέσματα' : 'Καμία κίνηση'}</p></div></div>`;
  } else {
    Object.keys(groups).sort((a,b) => new Date(b) - new Date(a)).forEach(date => {

      </div>

        <div class="stat-label">↓ ${fmtMoney(totalIncome)} · ↑ ${fmtMoney(totalExpense)}</div>
        <div class="stat-value" style="font-size:13px;font-weight:500;color:var(--ink-2)">Έσοδα · Έξοδα</div>

      <button class="filter-pill ${state.ui.filterType === 'expense' ? 'active' : ''}" onclick="setFilter('type','expense')" style="flex:1">Έξοδα</button>

  `;
}

        <button class="btn-danger-ghost" id="f-delete" style="width:100%;margin-top:10px;display:flex;align-items:center;justify-content:center;gap:6px;padding:12px">

function renderReports() {
  const tx = getPeriodTx(state.ui.activePeriod);
  const periodLabels = {day:'Σήμερα', week:'Τελευταίες 7 ημέρες', month:'Αυτόν τον μήνα', year:'Φέτος'};
  
  if (tx.length === 0) {
    return `
      <div class="period-picker">
        <button class="period-btn ${state.ui.activePeriod==='day'?'active':''}" data-period="day">Ημέρα</button>
        <button class="period-btn ${state.ui.activePeriod==='week'?'active':''}" data-period="week">Εβδομάδα</button>
        <button class="period-btn ${state.ui.activePeriod==='month'?'active':''}" data-period="month">Μήνας</button>
        <button class="period-btn ${state.ui.activePeriod==='year'?'active':''}" data-period="year">Έτος</button>
      </div>
      <div class="card"><div class="empty">${ICONS.emptyBox}<p>Δεν υπάρχουν κινήσεις<br>στην περίοδο</p></div></div>
    `;
  }
  
  const byAccount = state.accounts.map(a => {
    const aTx = tx.filter(t => t.accountId === a.id);
    const aIncome = aTx.filter(t => t.type === 'income').reduce((s,t)=>s+t.amount,0);
    const aExpense = aTx.filter(t => t.type === 'expense').reduce((s,t)=>s+t.amount,0);
    return { account: a, income: aIncome, expense: aExpense, balance: aIncome - aExpense };
  }).filter(a => a.income > 0 || a.expense > 0);
  
  const maxAccVal = Math.max(...byAccount.map(b => Math.max(b.income, b.expense)), 1);
  
  const byCatExp = {};
  tx.filter(t => t.type === 'expense').forEach(t => { byCatExp[t.categoryId] = (byCatExp[t.categoryId] || 0) + t.amount; });
  const catEntriesExp = Object.entries(byCatExp).sort((a,b) => b[1] - a[1]);
  const maxCatExp = catEntriesExp[0]?.[1] || 1;
  const totalExp = catEntriesExp.reduce((s,[,v]) => s+v, 0);
  
  const byCatInc = {};
  tx.filter(t => t.type === 'income').forEach(t => { byCatInc[t.categoryId] = (byCatInc[t.categoryId] || 0) + t.amount; });
  const catEntriesInc = Object.entries(byCatInc).sort((a,b) => b[1] - a[1]);
  const maxCatInc = catEntriesInc[0]?.[1] || 1;
  const totalInc = catEntriesInc.reduce((s,[,v]) => s+v, 0);
  
  return `
    <div class="period-picker">
      <button class="period-btn ${state.ui.activePeriod==='day'?'active':''}" data-period="day">Ημέρα</button>
      <button class="period-btn ${state.ui.activePeriod==='week'?'active':''}" data-period="week">Εβδομάδα</button>
      <button class="period-btn ${state.ui.activePeriod==='month'?'active':''}" data-period="month">Μήνας</button>
      <button class="period-btn ${state.ui.activePeriod==='year'?'active':''}" data-period="year">Έτος</button>
    </div>
    
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-label">Σύνολο εσόδων</div><div class="stat-value in">${fmtMoney(totalInc)}</div></div>
      <div class="stat-card"><div class="stat-label">Σύνολο εξόδων</div><div class="stat-value out">${fmtMoney(totalExp)}</div></div>
    </div>
    
    ${byAccount.length > 0 ? `
      <div class="section-title">Σύγκριση επιχειρήσεων · ${periodLabels[state.ui.activePeriod]}</div>
      <div class="card">
        ${byAccount.map(b => {
          const incPct = (b.income / maxAccVal) * 100;
          const expPct = (b.expense / maxAccVal) * 100;
          return `
            <div class="account-row-compare">
              <div class="account-row-compare-head">
                <div class="account-row-compare-name"><span class="dot" style="background:${b.account.color}"></span>${escapeHtml(b.account.name)}</div>
                <div class="account-row-compare-balance" style="color:${b.balance>=0?'var(--green)':'var(--red)'}">${fmtMoney(b.balance)}</div>
              </div>
              <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
                <div style="font-size:11px;color:var(--ink-2);flex:0 0 50px">Έσοδα</div>
                <div class="bar-track"><div class="bar-fill" style="width:${incPct}%;background:var(--green)"></div></div>
                <div style="font-size:12px;font-weight:600;flex:0 0 80px;text-align:right">${fmtMoney(b.income)}</div>
              </div>
              <div style="display:flex;align-items:center;gap:8px">
                <div style="font-size:11px;color:var(--ink-2);flex:0 0 50px">Έξοδα</div>
                <div class="bar-track"><div class="bar-fill" style="width:${expPct}%;background:var(--red)"></div></div>
                <div style="font-size:12px;font-weight:600;flex:0 0 80px;text-align:right">${fmtMoney(b.expense)}</div>
              </div>
            </div>
          `;
        }).join('')}
      </div>
    ` : ''}
    
    ${catEntriesExp.length > 0 ? `
      <div class="section-title">Ανάλυση εξόδων ανά κατηγορία</div>
      <div class="card">
        ${catEntriesExp.map(([catId, val]) => {
          const cat = state.categories.expense.find(c => c.id === catId);
          if (!cat) return '';
          const pct = (val / maxCatExp) * 100;
          const sharePct = totalExp > 0 ? Math.round((val / totalExp) * 100) : 0;
          return `
            <div class="bar-row">
              <div class="bar-label">${escapeHtml(cat.name)}</div>
              <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${cat.color}"></div></div>
              <div class="bar-value">${fmtMoney(val)}<div style="font-size:10px;color:var(--ink-3);font-weight:400">${sharePct}%</div></div>
            </div>
          `;
        }).join('')}
      </div>
    ` : ''}
    
    ${catEntriesInc.length > 0 ? `
      <div class="section-title">Ανάλυση εσόδων ανά κατηγορία</div>
      <div class="card">
        ${catEntriesInc.map(([catId, val]) => {
          const cat = state.categories.income.find(c => c.id === catId);
          if (!cat) return '';
          const pct = (val / maxCatInc) * 100;
          const sharePct = totalInc > 0 ? Math.round((val / totalInc) * 100) : 0;
          return `
            <div class="bar-row">
              <div class="bar-label">${escapeHtml(cat.name)}</div>
              <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${cat.color}"></div></div>
              <div class="bar-value">${fmtMoney(val)}<div style="font-size:10px;color:var(--ink-3);font-weight:400">${sharePct}%</div></div>
            </div>
          `;
        }).join('')}
      </div>
    ` : ''}
  `;
}

// ============ MODAL ============
function renderModal() {
  const modalType = state.ui.modal;
  if (!modalType) return;
  const oldModal = document.querySelector('.modal-backdrop');
  if (oldModal) oldModal.remove();
  
  let html = '';
  if (modalType === 'addAccount') {
    const usedColors = state.accounts.map(a => a.color);
    const availColor = ACCOUNT_COLORS.find(c => !usedColors.includes(c)) || ACCOUNT_COLORS[0];
    html = `
      <div class="modal-backdrop" id="modal-bd">
        <div class="modal" onclick="event.stopPropagation()">
          <h3 class="modal-title">Νέα επιχείρηση / ταμείο</h3>
          <label class="form-label">Όνομα</label>
          <input type="text" class="form-input" id="m-name" placeholder="π.χ. Καφετέρια" autocomplete="off">
          <label class="form-label">Τύπος</label>
          <div class="type-toggle">
            <button class="type-btn active-in" id="m-biz" type="button">${ICONS.briefcase} Επιχείρηση</button>
            <button class="type-btn" id="m-pers" type="button">${ICONS.user} Προσωπικό</button>
          </div>
          <label class="form-label">Χρώμα</label>
          <div class="color-grid" id="m-colors">
            ${ACCOUNT_COLORS.map(c => `<button class="color-swatch ${c===availColor?'selected':''}" data-color="${c}" style="background:${c}" type="button"></button>`).join('')}
          </div>
          <div class="modal-actions">
            <button class="btn-secondary" onclick="closeModal()">Άκυρο</button>
            <button class="btn-primary" id="m-save">Αποθήκευση</button>
          </div>
        </div>
      </div>
    `;
  } else if (modalType && modalType.startsWith('addCat:')) {
    const type = modalType.split(':')[1];
    html = `
      <div class="modal-backdrop" id="modal-bd">
        <div class="modal" onclick="event.stopPropagation()">
          <h3 class="modal-title">Νέα κατηγορία ${type==='expense'?'εξόδων':'εσόδων'}</h3>
          <label class="form-label">Όνομα</label>
          <input type="text" class="form-input" id="mc-name" placeholder="π.χ. Διαφήμιση" autocomplete="off">
          <label class="form-label">Χρώμα</label>
          <div class="color-grid" id="mc-colors">
            ${CATEGORY_COLORS.map((c,i) => `<button class="color-swatch ${i===0?'selected':''}" data-color="${c}" style="background:${c}" type="button"></button>`).join('')}
          </div>
          <div class="modal-actions">
            <button class="btn-secondary" onclick="closeModal()">Άκυρο</button>
            <button class="btn-primary" id="mc-save">Αποθήκευση</button>
          </div>
        </div>
      </div>
    `;
  } else if (modalType === 'addBank' || (modalType && modalType.startsWith('editBank:'))) {
    const isEdit = modalType.startsWith('editBank:');
    const bank = isEdit ? getBank(modalType.split(':')[1]) : null;
    const usedColors = state.banks.map(b => b.color);
    const availColor = bank?.color || BANK_COLORS.find(c => !usedColors.includes(c)) || BANK_COLORS[0];
    const kind = bank?.kind || 'bank';
    html = `
      <div class="modal-backdrop" id="modal-bd">
        <div class="modal" onclick="event.stopPropagation()">
          <h3 class="modal-title">${isEdit ? 'Επεξεργασία λογαριασμού' : 'Νέος λογαριασμός'}</h3>
          <label class="form-label">Τύπος</label>
          <div class="kind-toggle" id="b-kind-toggle">
            <button class="kind-toggle-btn ${kind==='bank'?'active':''}" data-kind="bank" type="button">${ICONS.bank} Τράπεζα</button>
            <button class="kind-toggle-btn ${kind==='card'?'active':''}" data-kind="card" type="button">${ICONS.card} Κάρτα</button>
          </div>
          <label class="form-label">Όνομα</label>
          <input type="text" class="form-input" id="b-name" placeholder="π.χ. Πειραιώς, Visa Eurobank" value="${escapeHtml(bank?.name || '')}" autocomplete="off">
          <label class="form-label">Τελευταία 4 ψηφία (προαιρετικό)</label>
          <input type="text" class="form-input" id="b-digits" placeholder="π.χ. 1234" maxlength="4" inputmode="numeric" value="${escapeHtml(bank?.lastDigits || '')}" autocomplete="off">
          <label class="form-label">${isEdit ? 'Αρχικό υπόλοιπο' : 'Αρχικό υπόλοιπο (€)'}</label>
          <input type="number" step="0.01" class="form-input" id="b-balance" placeholder="0.00" value="${bank ? bank.initialBalance : ''}" inputmode="decimal">
          <div class="form-hint">${isEdit ? 'Το υπόλοιπο που είχες όταν δημιούργησες τον λογαριασμό. Οι κινήσεις προστίθενται/αφαιρούνται από αυτό.' : 'Πόσα έχεις τώρα στον λογαριασμό/κάρτα'}</div>
          <label class="form-label">Χρώμα</label>
          <div class="color-grid" id="b-colors">
            ${BANK_COLORS.map(c => `<button class="color-swatch ${c===availColor?'selected':''}" data-color="${c}" style="background:${c}" type="button"></button>`).join('')}
          </div>
          <div class="modal-actions">
            ${isEdit ? `<button class="btn-danger-ghost" id="b-delete" style="padding:10px 14px">${ICONS.trash}</button>` : ''}
            <button class="btn-secondary" onclick="closeModal()">Άκυρο</button>
            <button class="btn-primary" id="b-save">Αποθήκευση</button>
          </div>
        </div>
      </div>
    `;
  }
  document.body.insertAdjacentHTML('beforeend', html);
  attachModalHandlers();
}

window.openModal = function(type) { state.ui.modal = type; renderModal(); };
window.closeModal = function() {
  state.ui.modal = null;
  const m = document.querySelector('.modal-backdrop');
  if (m) m.remove();
};

function attachModalHandlers() {
  const bd = document.getElementById('modal-bd');
  if (!bd) return;
  bd.onclick = (e) => { if (e.target === bd) closeModal(); };
  
  if (state.ui.modal === 'addAccount') {
    let selectedColor = document.querySelector('#m-colors .selected')?.dataset.color || ACCOUNT_COLORS[0];
    let isPersonal = false;
    document.querySelectorAll('#m-colors .color-swatch').forEach(b => {
      b.onclick = () => {
        document.querySelectorAll('#m-colors .color-swatch').forEach(x => x.classList.remove('selected'));
        b.classList.add('selected');
        selectedColor = b.dataset.color;
      };
    });
    const bizBtn = document.getElementById('m-biz');
    const persBtn = document.getElementById('m-pers');
    bizBtn.onclick = () => { isPersonal = false; bizBtn.classList.add('active-in'); persBtn.classList.remove('active-in'); };
    persBtn.onclick = () => { isPersonal = true; persBtn.classList.add('active-in'); bizBtn.classList.remove('active-in'); };
    document.getElementById('m-save').onclick = () => {
      const name = document.getElementById('m-name').value.trim();
      if (!name) { showToast('Δώσε όνομα'); return; }
      state.accounts.push({ id: uid(), name, color: selectedColor, isPersonal });
      saveState();
      closeModal();
      render();
      showToast('Προστέθηκε');
    };
    setTimeout(() => document.getElementById('m-name').focus(), 100);
  }
  
  if (state.ui.modal && state.ui.modal.startsWith('addCat:')) {
    const type = state.ui.modal.split(':')[1];
    let selectedColor = CATEGORY_COLORS[0];
    document.querySelectorAll('#mc-colors .color-swatch').forEach(b => {
      b.onclick = () => {
        document.querySelectorAll('#mc-colors .color-swatch').forEach(x => x.classList.remove('selected'));
        b.classList.add('selected');
        selectedColor = b.dataset.color;
      };
    });
    document.getElementById('mc-save').onclick = () => {
      const name = document.getElementById('mc-name').value.trim();
      if (!name) { showToast('Δώσε όνομα'); return; }
      state.categories[type].push({ id: uid(), name, color: selectedColor });
      saveState();
      closeModal();
      render();
      showToast('Προστέθηκε');
    };
    setTimeout(() => document.getElementById('mc-name').focus(), 100);
  }
  
  if (state.ui.modal === 'addBank' || (state.ui.modal && state.ui.modal.startsWith('editBank:'))) {
    const isEdit = state.ui.modal.startsWith('editBank:');
    const bankId = isEdit ? state.ui.modal.split(':')[1] : null;
    const bank = isEdit ? getBank(bankId) : null;
    let selectedColor = bank?.color || BANK_COLORS[0];
    let kind = bank?.kind || 'bank';
    
    document.querySelectorAll('#b-colors .color-swatch').forEach(b => {
      b.onclick = () => {
        document.querySelectorAll('#b-colors .color-swatch').forEach(x => x.classList.remove('selected'));
        b.classList.add('selected');
        selectedColor = b.dataset.color;
      };
    });
    document.querySelectorAll('#b-kind-toggle .kind-toggle-btn').forEach(b => {
      b.onclick = () => {
        document.querySelectorAll('#b-kind-toggle .kind-toggle-btn').forEach(x => x.classList.remove('active'));
        b.classList.add('active');
        kind = b.dataset.kind;
      };
    });
    
    document.getElementById('b-save').onclick = () => {
      const name = document.getElementById('b-name').value.trim();
      const digits = document.getElementById('b-digits').value.trim().replace(/\D/g,'').slice(-4);
      const balanceStr = document.getElementById('b-balance').value.trim();
      const balance = balanceStr === '' ? 0 : parseFloat(balanceStr);
      if (!name) { showToast('Δώσε όνομα'); return; }
      if (isNaN(balance)) { showToast('Άκυρο ποσό'); return; }
      
      if (isEdit) {
        bank.name = name;
        bank.kind = kind;
        bank.lastDigits = digits;
        bank.initialBalance = balance;
        bank.color = selectedColor;
      } else {
        state.banks.push({
          id: uid(),
          name,
          kind,
          lastDigits: digits,
          initialBalance: balance,
          color: selectedColor
        });
      }
      saveState();
      closeModal();
      render();
      showToast(isEdit ? 'Αποθηκεύτηκε' : 'Προστέθηκε');
    };
    
    if (isEdit) {
      const delBtn = document.getElementById('b-delete');
      if (delBtn) delBtn.onclick = () => {
        const linked = state.transactions.filter(t => t.bankId === bankId).length;
        const msg = linked > 0 
          ? `Διαγραφή του "${bank.name}";\n\n${linked} κινήσεις έχουν συνδεθεί με αυτόν - θα γίνουν "μετρητά".`
          : `Διαγραφή του "${bank.name}";`;
        if (!confirm(msg)) return;
        state.transactions.forEach(t => {
          if (t.bankId === bankId) {
            delete t.bankId;
            t.paymentMethod = 'cash';
          }
        });
        state.banks = state.banks.filter(b => b.id !== bankId);
        saveState();
        closeModal();
        render();
        showToast('Διαγράφηκε');
      };
    }
    
    setTimeout(() => document.getElementById('b-name').focus(), 100);
  }
}

window.openBankModal = function() { state.ui.modal = 'addBank'; renderModal(); };
window.editBank = function(id) { state.ui.modal = 'editBank:' + id; renderModal(); };

window.toggleBanksHidden = function() {
  state.ui.banksHidden = !state.ui.banksHidden;
  localStorage.setItem(BANK_HIDDEN_KEY, state.ui.banksHidden ? '1' : '0');
  render();
};

// ============ ACTIONS ============
window.deleteAccount = function(id) {
  const acc = getAccount(id);
  const count = state.transactions.filter(t => t.accountId === id).length;
  if (!confirm(`Διαγραφή του "${acc.name}";${count > 0 ? '\n\nΘα διαγραφούν επίσης ' + count + ' κινήσεις.' : ''}`)) return;
  state.accounts = state.accounts.filter(a => a.id !== id);
  state.transactions = state.transactions.filter(t => t.accountId !== id);
  saveState();
  render();
  showToast('Διαγράφηκε');
};

window.deleteCategory = function(type, id) {
  if (state.categories[type].length <= 1) { showToast('Πρέπει να μείνει τουλάχιστον μία'); return; }
  if (!confirm('Διαγραφή κατηγορίας;')) return;
  state.categories[type] = state.categories[type].filter(c => c.id !== id);
  saveState();
  render();
};

window.setFilter = function(kind, value) {
  if (kind === 'account') state.ui.filterAccount = value;
  if (kind === 'type') state.ui.filterType = value;
  render();
};

window.clearSearch = function() {
  state.ui.searchQuery = '';
  render();
};

window.filterByAccount = function(accId) {
  state.ui.filterAccount = accId;
  state.ui.filterType = 'all';
  state.ui.searchQuery = '';
  state.ui.activeTab = 'transactions';
  render();
};

window.editTransaction = function(id) {
  const t = state.transactions.find(x => x.id === id);
  if (!t) return;
  state.ui.editTx = id;
  state.form = {
    type: t.type, accountId: t.accountId, categoryId: t.categoryId,
    amount: String(t.amount), note: t.note || '', date: t.date,
    paymentMethod: t.paymentMethod || 'cash',
    bankId: t.bankId || ''
  };
  state.ui.activeTab = 'add';
  render();
};

window.resetAll = function() {
  if (!confirm('Είσαι σίγουρος; Θα διαγραφούν ΟΛΑ τα δεδομένα.')) return;
  if (!confirm('Τελευταία προειδοποίηση. Σίγουρα;')) return;
  localStorage.removeItem(STORAGE_KEY);
  state.accounts = [];
  state.banks = [];
  state.transactions = [];
  state.categories = JSON.parse(JSON.stringify(DEFAULT_CATEGORIES));
  loadState();
  saveLocal();
  if (state.sync.isSignedIn) syncToDrive();
  render();
  showToast('Όλα διαγράφηκαν');
};

window.exportData = function() {
  const data = {
    version: 4, exported: new Date().toISOString(),
    accounts: state.accounts, banks: state.banks, transactions: state.transactions, categories: state.categories
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'oikonomika_' + todayISO() + '.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('Αποθηκεύτηκε');
};

window.exportCSV = function() {
  const rows = [['Ημερομηνία','Τύπος','Επιχείρηση','Κατηγορία','Ποσό','Σημείωση']];
  state.transactions.slice().sort((a,b) => new Date(b.date) - new Date(a.date)).forEach(t => {
    const acc = getAccount(t.accountId);
    const cat = getCategory(t.type, t.categoryId);
    rows.push([t.date, t.type === 'income' ? 'Έσοδο' : 'Έξοδο', acc?.name || '', cat?.name || '', t.amount.toFixed(2).replace('.', ','), t.note || '']);
  });
  const csv = '\uFEFF' + rows.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(';')).join('\r\n');
  const blob = new Blob([csv], {type: 'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'oikonomika_' + todayISO() + '.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('CSV έτοιμο');
};

window.signIn = signIn;
window.signOut = signOut;
window.syncNow = function() {
  if (!state.sync.isSignedIn) { signIn(); return; }
  syncToDrive();
};

function importDataFile(file) {
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      if (!data.accounts || !data.transactions) throw new Error('invalid');
      if (!confirm('Θα αντικατασταθούν ΟΛΑ τα τρέχοντα δεδομένα.\n\nΣυνέχεια;')) return;
      state.accounts = data.accounts;
      state.banks = data.banks || [];
      state.transactions = data.transactions;
      if (data.categories) state.categories = data.categories;
      saveState();
      render();
      showToast('Φορτώθηκαν');
    } catch(err) { alert('Σφάλμα: άκυρο αρχείο'); }
  };
  reader.readAsText(file);
}

function showToast(msg) {
  const old = document.querySelector('.toast');
  if (old) old.remove();
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2600);
}

// ============ HANDLERS ============
function attachHandlers() {
  document.querySelectorAll('[data-period]').forEach(b => {
    b.onclick = () => { state.ui.activePeriod = b.dataset.period; render(); };
  });
  document.querySelectorAll('[data-form-type]').forEach(b => {
    b.onclick = () => { state.form.type = b.dataset.formType; state.form.categoryId = ''; render(); };
  });
  
  const searchEl = document.getElementById('search-input');
  if (searchEl) {
    let searchDebounce;
    searchEl.oninput = e => {
      clearTimeout(searchDebounce);
      const v = e.target.value;
      searchDebounce = setTimeout(() => {
        state.ui.searchQuery = v;
        render();
        const newSearch = document.getElementById('search-input');
        if (newSearch) {
          newSearch.focus();
          newSearch.setSelectionRange(v.length, v.length);
        }
      }, 250);
    };
  }
  
  const amountEl = document.getElementById('f-amount');
  if (amountEl) {
    amountEl.oninput = e => state.form.amount = e.target.value;
    if (!state.ui.editTx) setTimeout(() => amountEl.focus(), 100);
  }
  const accEl = document.getElementById('f-account');
  if (accEl) accEl.onchange = e => state.form.accountId = e.target.value;
  const catEl = document.getElementById('f-category');
  if (catEl) catEl.onchange = e => state.form.categoryId = e.target.value;
  const dateEl = document.getElementById('f-date');
  if (dateEl) dateEl.onchange = e => state.form.date = e.target.value;
  const noteEl = document.getElementById('f-note');
  if (noteEl) noteEl.oninput = e => state.form.note = e.target.value;
  
  // Payment method buttons (Μετρητά / Κάρτα / Τράπεζα)
  document.querySelectorAll('#f-method-grid .payment-method-btn').forEach(btn => {
    btn.onclick = () => {
      const method = btn.dataset.method;
      state.form.paymentMethod = method;
      // If switching to cash, clear bankId; otherwise keep selection if compatible
      if (method === 'cash') {
        state.form.bankId = '';
      } else {
        // If selected bank doesn't match new method kind, clear it
        const currentBank = getBank(state.form.bankId);
        if (currentBank) {
          const expectedKind = method === 'card' ? 'card' : 'bank';
          if (currentBank.kind !== expectedKind) state.form.bankId = '';
        }
      }
      render();
    };
  });
  
  // Bank/Card selection buttons
  document.querySelectorAll('#f-bank-list .bank-select-option').forEach(btn => {
    btn.onclick = () => {
      state.form.bankId = btn.dataset.bankId;
      document.querySelectorAll('#f-bank-list .bank-select-option').forEach(x => x.classList.remove('active'));
      btn.classList.add('active');
    };
  });
  
  const saveBtn = document.getElementById('f-save');
  if (saveBtn) saveBtn.onclick = saveTransaction;
  
  const delBtn = document.getElementById('f-delete');
  if (delBtn) delBtn.onclick = () => {
    if (!confirm('Διαγραφή κίνησης;')) return;
    state.transactions = state.transactions.filter(t => t.id !== state.ui.editTx);
    state.ui.editTx = null;
    state.form = { type: 'expense', accountId: '', categoryId: '', amount: '', note: '', date: todayISO(), paymentMethod: 'cash', bankId: '' };
    saveState();
    state.ui.activeTab = 'transactions';
    render();
    showToast('Διαγράφηκε');
  };
}

function saveTransaction() {
  const methodGrid = document.getElementById('f-method-grid');
  if (methodGrid) {
    const activeMethod = methodGrid.querySelector('.payment-method-btn.active');
    if (activeMethod) state.form.paymentMethod = activeMethod.dataset.method;
  }
  const bankList = document.getElementById('f-bank-list');
  if (bankList) {
    const activeBank = bankList.querySelector('.bank-select-option.active');
    state.form.bankId = activeBank ? activeBank.dataset.bankId : '';
  }

  const amt = parseFloat(state.form.amount);
  if (!amt || amt <= 0) { showToast('Δώσε ποσό > 0'); return; }
  if (!state.form.accountId) { showToast('Επίλεξε επιχείρηση'); return; }
  if (!state.form.categoryId) { showToast('Επίλεξε κατηγορία'); return; }
  
  const method = state.form.paymentMethod || 'cash';
  const bankId = (method === 'card' || method === 'bank') ? (state.form.bankId || '') : '';
  
  // Validate: if method is card/bank, must have bankId
  if ((method === 'card' || method === 'bank') && !bankId) {
    showToast('Διάλεξε ' + (method === 'card' ? 'κάρτα' : 'τράπεζα'));
    return;
  }
  
  const wasEdit = !!state.ui.editTx;
  
  if (wasEdit) {
    const idx = state.transactions.findIndex(t => t.id === state.ui.editTx);
    if (idx >= 0) {
      state.transactions[idx] = {
        ...state.transactions[idx],
        type: state.form.type,
        accountId: state.form.accountId,
        categoryId: state.form.categoryId,
        amount: amt,
        note: state.form.note,
        date: state.form.date,
        paymentMethod: method,
        bankId: bankId
      };
    }
    state.ui.editTx = null;
  } else {
    state.transactions.push({
      id: uid(),
      type: state.form.type,
      accountId: state.form.accountId,
      categoryId: state.form.categoryId,
      amount: amt,
      note: state.form.note,
      date: state.form.date,
      paymentMethod: method,
      bankId: bankId,
      createdAt: new Date().toISOString()
    });
  }
  
  const keepType = state.form.type, keepAccount = state.form.accountId;
  state.form = { type: keepType, accountId: keepAccount, categoryId: '', amount: '', note: '', date: todayISO(), paymentMethod: 'cash', bankId: '' };
  
  saveState();
  state.ui.activeTab = 'dashboard';
  render();
  showToast(wasEdit ? 'Ενημερώθηκε' : 'Καταχωρήθηκε');
}

// ============ INIT ============
document.querySelectorAll('.nav-item[data-tab]').forEach(b => {
  b.onclick = () => {
    state.ui.activeTab = b.dataset.tab;
    if (b.dataset.tab === 'add' && !state.ui.editTx) {
      state.form = { type: state.form.type || 'expense', accountId: state.form.accountId, categoryId: '', amount: '', note: '', date: todayISO(), paymentMethod: 'cash', bankId: '' };
    }
    if (b.dataset.tab !== 'add') state.ui.editTx = null;
    if (b.dataset.tab === 'transactions') {
      state.ui.searchQuery = '';
    }
    render();
  };
});

document.getElementById('sync-btn').onclick = () => {
  if (!state.sync.isSignedIn) signIn();
  else syncToDrive();
};

document.getElementById('import-file').onchange = (e) => {
  if (e.target.files[0]) { importDataFile(e.target.files[0]); e.target.value = ''; }
};

window.addEventListener('online', () => { if (state.sync.isSignedIn && state.sync.pendingChanges > 0) scheduleSync(); });

// Wait for Google APIs to load
function checkGoogleAPIs() {
  if (typeof gapi !== 'undefined' && typeof google !== 'undefined' && google.accounts) {
    gapiLoad();
    gisLoad();
  } else {
    setTimeout(checkGoogleAPIs, 100);
  }
}

loadState();
render();
checkGoogleAPIs();
</script>
