<style>
.fm-app { font-family: var(--font-sans); color: var(--color-text-primary); padding: 0.5rem 0 1rem; }
.fm-tabs { display: flex; gap: 4px; background: var(--color-background-secondary); padding: 4px; border-radius: var(--border-radius-md); margin-bottom: 1rem; }
.fm-tab { flex: 1; padding: 8px 4px; border: none; background: transparent; font-size: 12px; font-weight: 500; color: var(--color-text-secondary); border-radius: 6px; cursor: pointer; font-family: inherit; }
.fm-tab.active { background: var(--color-background-primary); color: var(--color-text-primary); }
.fm-tab i { font-size: 16px; display: block; margin-bottom: 2px; }
.fm-card { background: var(--color-background-primary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); padding: 1rem; margin-bottom: 12px; }
.fm-stat { background: var(--color-background-secondary); border-radius: var(--border-radius-md); padding: 0.875rem; }
.fm-stat-label { font-size: 12px; color: var(--color-text-secondary); margin-bottom: 4px; }
.fm-stat-value { font-size: 20px; font-weight: 500; }
.fm-stat-value.income { color: var(--color-text-success); }
.fm-stat-value.expense { color: var(--color-text-danger); }
.fm-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 0.5px solid var(--color-border-tertiary); }
.fm-row:last-child { border-bottom: none; }
.fm-row-left { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.fm-icon-box { width: 36px; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.fm-icon-box i { font-size: 18px; }
.fm-row-title { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fm-row-sub { font-size: 12px; color: var(--color-text-secondary); margin-top: 1px; }
.fm-row-amount { font-size: 14px; font-weight: 500; white-space: nowrap; margin-left: 8px; }
.fm-row-amount.income { color: var(--color-text-success); }
.fm-row-amount.expense { color: var(--color-text-danger); }
.fm-btn-primary { width: 100%; padding: 12px; background: var(--color-text-primary); color: var(--color-background-primary); border: none; border-radius: var(--border-radius-md); font-size: 14px; font-weight: 500; cursor: pointer; font-family: inherit; display: flex; align-items: center; justify-content: center; gap: 6px; }
.fm-btn-primary i { font-size: 18px; }
.fm-btn-secondary { padding: 10px 12px; background: var(--color-background-secondary); color: var(--color-text-primary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-md); font-size: 13px; cursor: pointer; font-family: inherit; }
.fm-btn-danger { background: transparent; color: var(--color-text-danger); border: none; cursor: pointer; padding: 4px 8px; font-size: 12px; font-family: inherit; }
.fm-input, .fm-select { width: 100%; padding: 10px 12px; border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-md); background: var(--color-background-primary); color: var(--color-text-primary); font-size: 14px; font-family: inherit; box-sizing: border-box; margin-bottom: 8px; }
.fm-label { font-size: 12px; color: var(--color-text-secondary); margin-bottom: 4px; display: block; font-weight: 500; }
.fm-type-toggle { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
.fm-type-btn { padding: 12px; border: 0.5px solid var(--color-border-tertiary); background: var(--color-background-primary); border-radius: var(--border-radius-md); font-size: 13px; font-weight: 500; cursor: pointer; font-family: inherit; color: var(--color-text-secondary); }
.fm-type-btn.active-income { background: var(--color-background-success); border-color: var(--color-border-success); color: var(--color-text-success); }
.fm-type-btn.active-expense { background: var(--color-background-danger); border-color: var(--color-border-danger); color: var(--color-text-danger); }
.fm-section-title { font-size: 13px; font-weight: 500; color: var(--color-text-secondary); margin: 1.25rem 0 8px; text-transform: uppercase; letter-spacing: 0.5px; }
.fm-empty { text-align: center; padding: 2rem 1rem; color: var(--color-text-tertiary); font-size: 13px; }
.fm-empty i { font-size: 32px; display: block; margin-bottom: 8px; opacity: 0.5; }
.fm-bar-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; font-size: 12px; }
.fm-bar-label { flex: 0 0 90px; color: var(--color-text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fm-bar-track { flex: 1; height: 8px; background: var(--color-background-secondary); border-radius: 4px; overflow: hidden; }
.fm-bar-fill { height: 100%; border-radius: 4px; }
.fm-bar-value { flex: 0 0 70px; text-align: right; font-weight: 500; font-size: 12px; }
.fm-period-pick { display: flex; gap: 4px; background: var(--color-background-secondary); padding: 3px; border-radius: var(--border-radius-md); margin-bottom: 1rem; }
.fm-period-pick button { flex: 1; padding: 6px; border: none; background: transparent; font-size: 12px; color: var(--color-text-secondary); border-radius: 6px; cursor: pointer; font-family: inherit; }
.fm-period-pick button.active { background: var(--color-background-primary); color: var(--color-text-primary); font-weight: 500; }
.fm-account-pill { display: inline-block; padding: 3px 8px; border-radius: 10px; font-size: 11px; font-weight: 500; margin-right: 4px; }
.fm-modal-bg { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: flex; align-items: flex-end; z-index: 100; border-radius: var(--border-radius-lg); }
.fm-modal { background: var(--color-background-primary); width: 100%; border-radius: var(--border-radius-lg) var(--border-radius-lg) 0 0; padding: 1.25rem; max-height: 90%; overflow-y: auto; }
.fm-modal h3 { margin: 0 0 1rem; font-size: 16px; font-weight: 500; }
.fm-pos-rel { position: relative; min-height: 500px; }
.fm-sync-badge { font-size: 11px; color: var(--color-text-tertiary); display: flex; align-items: center; gap: 4px; margin-bottom: 8px; }
.fm-sync-badge i { font-size: 13px; }
.fm-cat-color { width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0; }
.fm-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
</style>

<div class="fm-app fm-pos-rel" id="app-root">
  <div class="fm-sync-badge"><i class="ti ti-cloud-check"></i><span id="sync-status">Συγχρονισμένο</span></div>

  <div class="fm-tabs">
    <button class="fm-tab active" data-tab="dashboard"><i class="ti ti-layout-dashboard"></i>Πίνακας</button>
    <button class="fm-tab" data-tab="add"><i class="ti ti-plus"></i>Νέα</button>
    <button class="fm-tab" data-tab="reports"><i class="ti ti-chart-bar"></i>Αναφορές</button>
    <button class="fm-tab" data-tab="settings"><i class="ti ti-settings"></i>Ρυθμίσεις</button>
  </div>

  <div id="tab-content"></div>

  <div id="modal-host"></div>
</div>

<script>
(function() {
  const ACCOUNT_COLORS = ['#378ADD','#1D9E75','#D85A30','#D4537E','#7F77DD','#BA7517','#639922','#888780'];
  const DEFAULT_CATEGORIES = {
    expense: [
      {id:'misth', name:'Μισθοδοσία', color:'#D85A30'},
      {id:'enoik', name:'Ενοίκια', color:'#BA7517'},
      {id:'logar', name:'Λογαριασμοί ΔΕΚΟ', color:'#7F77DD'},
      {id:'prom',  name:'Προμήθειες', color:'#378ADD'},
      {id:'fpa',   name:'ΦΠΑ/Φόροι', color:'#D4537E'},
      {id:'kayk',  name:'Καύσιμα/Μεταφορικά', color:'#888780'},
      {id:'allo_e',name:'Άλλα έξοδα', color:'#5F5E5A'}
    ],
    income: [
      {id:'pol',   name:'Πωλήσεις', color:'#1D9E75'},
      {id:'yph',   name:'Υπηρεσίες', color:'#378ADD'},
      {id:'epist', name:'Επιστροφές/Εκπτώσεις', color:'#7F77DD'},
      {id:'allo_i',name:'Άλλα έσοδα', color:'#639922'}
    ]
  };

  let state = {
    accounts: [],
    transactions: [],
    categories: DEFAULT_CATEGORIES,
    activeTab: 'dashboard',
    activePeriod: 'month',
    modal: null,
    form: { type: 'expense', accountId: '', categoryId: '', amount: '', note: '', date: new Date().toISOString().slice(0,10) }
  };

  const STORAGE_KEY = 'finance-app-state';

  async function loadState() {
    try {
      const res = await window.storage.get(STORAGE_KEY);
      if (res && res.value) {
        const saved = JSON.parse(res.value);
        state.accounts = saved.accounts || [];
        state.transactions = saved.transactions || [];
        if (saved.categories) state.categories = saved.categories;
      }
    } catch(e) {
      // First time - no data yet
    }
    if (state.accounts.length === 0) {
      // Seed with sample so user sees structure
      state.accounts = [
        {id:'acc_personal', name:'Προσωπικά', color:'#888780', isPersonal:true}
      ];
      await saveState();
    }
  }

  async function saveState() {
    try {
      document.getElementById('sync-status').textContent = 'Συγχρονισμός...';
      await window.storage.set(STORAGE_KEY, JSON.stringify({
        accounts: state.accounts,
        transactions: state.transactions,
        categories: state.categories
      }));
      document.getElementById('sync-status').textContent = 'Συγχρονισμένο';
    } catch(e) {
      document.getElementById('sync-status').textContent = 'Σφάλμα αποθήκευσης';
    }
  }

  function fmtMoney(n) {
    return new Intl.NumberFormat('el-GR', {style:'currency', currency:'EUR', maximumFractionDigits: 2}).format(Math.round(n*100)/100);
  }

  function fmtDate(d) {
    const dt = new Date(d);
    return dt.toLocaleDateString('el-GR', {day:'2-digit', month:'2-digit', year:'numeric'});
  }

  function getPeriodTx(period) {
    const now = new Date();
    return state.transactions.filter(t => {
      const td = new Date(t.date);
      if (period === 'day') return td.toDateString() === now.toDateString();
      if (period === 'month') return td.getMonth() === now.getMonth() && td.getFullYear() === now.getFullYear();
      if (period === 'year') return td.getFullYear() === now.getFullYear();
      return true;
    });
  }

  function uid() { return 'id_' + Date.now() + '_' + Math.random().toString(36).slice(2,7); }

  // ============= RENDER =============
  function render() {
    document.querySelectorAll('.fm-tab').forEach(b => {
      b.classList.toggle('active', b.dataset.tab === state.activeTab);
    });
    const host = document.getElementById('tab-content');
    if (state.activeTab === 'dashboard') host.innerHTML = renderDashboard();
    else if (state.activeTab === 'add') host.innerHTML = renderAddForm();
    else if (state.activeTab === 'reports') host.innerHTML = renderReports();
    else if (state.activeTab === 'settings') host.innerHTML = renderSettings();
    attachHandlers();
    document.getElementById('modal-host').innerHTML = state.modal ? renderModal() : '';
    if (state.modal) attachModalHandlers();
  }

  function renderDashboard() {
    const tx = getPeriodTx(state.activePeriod);
    const income = tx.filter(t => t.type === 'income').reduce((s,t) => s + t.amount, 0);
    const expense = tx.filter(t => t.type === 'expense').reduce((s,t) => s + t.amount, 0);
    const balance = income - expense;
    const periodLabels = {day:'Σήμερα', month:'Αυτόν τον μήνα', year:'Φέτος'};

    let accountsHtml = '';
    if (state.accounts.length === 0) {
      accountsHtml = '<div class="fm-empty"><i class="ti ti-briefcase-off"></i>Δεν έχεις προσθέσει επιχειρήσεις. Πήγαινε στις Ρυθμίσεις.</div>';
    } else {
      accountsHtml = state.accounts.map(acc => {
        const aTx = tx.filter(t => t.accountId === acc.id);
        const aIncome = aTx.filter(t => t.type === 'income').reduce((s,t)=>s+t.amount,0);
        const aExpense = aTx.filter(t => t.type === 'expense').reduce((s,t)=>s+t.amount,0);
        const aBalance = aIncome - aExpense;
        return `
          <div class="fm-row">
            <div class="fm-row-left">
              <div class="fm-icon-box" style="background:${acc.color}22; color:${acc.color}">
                <i class="ti ti-${acc.isPersonal ? 'user' : 'building-store'}"></i>
              </div>
              <div style="min-width:0;flex:1">
                <div class="fm-row-title">${escapeHtml(acc.name)}</div>
                <div class="fm-row-sub">Έσοδα ${fmtMoney(aIncome)} · Έξοδα ${fmtMoney(aExpense)}</div>
              </div>
            </div>
            <div class="fm-row-amount ${aBalance >= 0 ? 'income' : 'expense'}">${fmtMoney(aBalance)}</div>
          </div>
        `;
      }).join('');
    }

    const recentTx = [...state.transactions].sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,5);
    let recentHtml = '';
    if (recentTx.length === 0) {
      recentHtml = '<div class="fm-empty"><i class="ti ti-receipt-off"></i>Καμία κίνηση ακόμα</div>';
    } else {
      recentHtml = recentTx.map(t => {
        const acc = state.accounts.find(a => a.id === t.accountId);
        const cat = (state.categories[t.type] || []).find(c => c.id === t.categoryId);
        return `
          <div class="fm-row">
            <div class="fm-row-left">
              <div class="fm-icon-box" style="background:${(cat?.color || '#888')}22; color:${cat?.color || '#888'}">
                <i class="ti ti-${t.type === 'income' ? 'arrow-down-left' : 'arrow-up-right'}"></i>
              </div>
              <div style="min-width:0;flex:1">
                <div class="fm-row-title">${escapeHtml(cat?.name || '—')}</div>
                <div class="fm-row-sub">${escapeHtml(acc?.name || '—')} · ${fmtDate(t.date)}</div>
              </div>
            </div>
            <div class="fm-row-amount ${t.type}">${t.type === 'expense' ? '-' : '+'}${fmtMoney(t.amount)}</div>
          </div>
        `;
      }).join('');
    }

    return `
      <div class="fm-period-pick">
        <button class="${state.activePeriod==='day'?'active':''}" data-period="day">Ημέρα</button>
        <button class="${state.activePeriod==='month'?'active':''}" data-period="month">Μήνας</button>
        <button class="${state.activePeriod==='year'?'active':''}" data-period="year">Έτος</button>
      </div>
      <div class="fm-card">
        <div style="font-size:12px;color:var(--color-text-secondary);margin-bottom:4px">${periodLabels[state.activePeriod]}</div>
        <div style="font-size:26px;font-weight:500;color:${balance>=0?'var(--color-text-success)':'var(--color-text-danger)'};margin-bottom:12px">${fmtMoney(balance)}</div>
        <div class="fm-grid-2">
          <div class="fm-stat">
            <div class="fm-stat-label">Έσοδα</div>
            <div class="fm-stat-value income">${fmtMoney(income)}</div>
          </div>
          <div class="fm-stat">
            <div class="fm-stat-label">Έξοδα</div>
            <div class="fm-stat-value expense">${fmtMoney(expense)}</div>
          </div>
        </div>
      </div>

      <div class="fm-section-title">Επιχειρήσεις & Ταμεία</div>
      <div class="fm-card">${accountsHtml}</div>

      <div class="fm-section-title">Πρόσφατες κινήσεις</div>
      <div class="fm-card">${recentHtml}</div>
    `;
  }

  function renderAddForm() {
    if (state.accounts.length === 0) {
      return '<div class="fm-empty"><i class="ti ti-alert-circle"></i>Πρόσθεσε πρώτα μια επιχείρηση/ταμείο από τις Ρυθμίσεις</div>';
    }
    const f = state.form;
    if (!f.accountId) f.accountId = state.accounts[0].id;
    const cats = state.categories[f.type] || [];
    if (!f.categoryId || !cats.find(c=>c.id===f.categoryId)) f.categoryId = cats[0]?.id || '';

    return `
      <div class="fm-card">
        <div class="fm-type-toggle">
          <button class="fm-type-btn ${f.type==='income'?'active-income':''}" data-type="income">
            <i class="ti ti-arrow-down-left"></i> Έσοδο
          </button>
          <button class="fm-type-btn ${f.type==='expense'?'active-expense':''}" data-type="expense">
            <i class="ti ti-arrow-up-right"></i> Έξοδο
          </button>
        </div>

        <label class="fm-label">Ποσό (€)</label>
        <input type="number" inputmode="decimal" class="fm-input" id="f-amount" value="${f.amount}" placeholder="0.00" step="0.01" />

        <label class="fm-label">Επιχείρηση/Ταμείο</label>
        <select class="fm-select" id="f-account">
          ${state.accounts.map(a => `<option value="${a.id}" ${a.id===f.accountId?'selected':''}>${escapeHtml(a.name)}</option>`).join('')}
        </select>

        <label class="fm-label">Κατηγορία</label>
        <select class="fm-select" id="f-category">
          ${cats.map(c => `<option value="${c.id}" ${c.id===f.categoryId?'selected':''}>${escapeHtml(c.name)}</option>`).join('')}
        </select>

        <label class="fm-label">Ημερομηνία</label>
        <input type="date" class="fm-input" id="f-date" value="${f.date}" />

        <label class="fm-label">Σημείωση (προαιρετικό)</label>
        <input type="text" class="fm-input" id="f-note" value="${escapeHtml(f.note)}" placeholder="π.χ. τιμολόγιο 1234" />

        <button class="fm-btn-primary" id="f-save"><i class="ti ti-check"></i>Καταχώρηση</button>
      </div>
    `;
  }

  function renderReports() {
    const tx = getPeriodTx(state.activePeriod);
    const periodLabels = {day:'Σήμερα', month:'Αυτόν τον μήνα', year:'Φέτος'};

    // By account
    const byAccount = {};
    state.accounts.forEach(a => byAccount[a.id] = {income:0, expense:0, account:a});
    tx.forEach(t => {
      if (!byAccount[t.accountId]) return;
      byAccount[t.accountId][t.type] += t.amount;
    });

    // By category (expenses)
    const byCatExp = {};
    tx.filter(t=>t.type==='expense').forEach(t => {
      byCatExp[t.categoryId] = (byCatExp[t.categoryId] || 0) + t.amount;
    });
    const catEntriesExp = Object.entries(byCatExp).sort((a,b)=>b[1]-a[1]);
    const maxCatExp = Math.max(...catEntriesExp.map(([,v])=>v), 1);

    // By category (income)
    const byCatInc = {};
    tx.filter(t=>t.type==='income').forEach(t => {
      byCatInc[t.categoryId] = (byCatInc[t.categoryId] || 0) + t.amount;
    });
    const catEntriesInc = Object.entries(byCatInc).sort((a,b)=>b[1]-a[1]);
    const maxCatInc = Math.max(...catEntriesInc.map(([,v])=>v), 1);

    if (tx.length === 0) {
      return `
        <div class="fm-period-pick">
          <button class="${state.activePeriod==='day'?'active':''}" data-period="day">Ημέρα</button>
          <button class="${state.activePeriod==='month'?'active':''}" data-period="month">Μήνας</button>
          <button class="${state.activePeriod==='year'?'active':''}" data-period="year">Έτος</button>
        </div>
        <div class="fm-empty"><i class="ti ti-chart-pie-off"></i>Δεν υπάρχουν κινήσεις στη συγκεκριμένη περίοδο</div>
      `;
    }

    return `
      <div class="fm-period-pick">
        <button class="${state.activePeriod==='day'?'active':''}" data-period="day">Ημέρα</button>
        <button class="${state.activePeriod==='month'?'active':''}" data-period="month">Μήνας</button>
        <button class="${state.activePeriod==='year'?'active':''}" data-period="year">Έτος</button>
      </div>

      <div class="fm-section-title">Σύγκριση επιχειρήσεων · ${periodLabels[state.activePeriod]}</div>
      <div class="fm-card">
        ${Object.values(byAccount).map(b => {
          const bal = b.income - b.expense;
          return `
            <div style="margin-bottom:14px">
              <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
                <div style="font-size:13px;font-weight:500;display:flex;align-items:center;gap:6px">
                  <span class="fm-cat-color" style="background:${b.account.color}"></span>${escapeHtml(b.account.name)}
                </div>
                <div style="font-size:13px;font-weight:500;color:${bal>=0?'var(--color-text-success)':'var(--color-text-danger)'}">${fmtMoney(bal)}</div>
              </div>
              <div style="display:flex;gap:6px">
                <div style="flex:1">
                  <div style="font-size:11px;color:var(--color-text-secondary)">Έσοδα ${fmtMoney(b.income)}</div>
                </div>
                <div style="flex:1">
                  <div style="font-size:11px;color:var(--color-text-secondary)">Έξοδα ${fmtMoney(b.expense)}</div>
                </div>
              </div>
            </div>
          `;
        }).join('')}
      </div>

      ${catEntriesExp.length ? `
      <div class="fm-section-title">Ανάλυση εξόδων ανά κατηγορία</div>
      <div class="fm-card">
        ${catEntriesExp.map(([catId, val]) => {
          const cat = state.categories.expense.find(c=>c.id===catId);
          if (!cat) return '';
          const pct = (val/maxCatExp)*100;
          return `
            <div class="fm-bar-row">
              <div class="fm-bar-label">${escapeHtml(cat.name)}</div>
              <div class="fm-bar-track"><div class="fm-bar-fill" style="width:${pct}%;background:${cat.color}"></div></div>
              <div class="fm-bar-value">${fmtMoney(val)}</div>
            </div>
          `;
        }).join('')}
      </div>` : ''}

      ${catEntriesInc.length ? `
      <div class="fm-section-title">Ανάλυση εσόδων ανά κατηγορία</div>
      <div class="fm-card">
        ${catEntriesInc.map(([catId, val]) => {
          const cat = state.categories.income.find(c=>c.id===catId);
          if (!cat) return '';
          const pct = (val/maxCatInc)*100;
          return `
            <div class="fm-bar-row">
              <div class="fm-bar-label">${escapeHtml(cat.name)}</div>
              <div class="fm-bar-track"><div class="fm-bar-fill" style="width:${pct}%;background:${cat.color}"></div></div>
              <div class="fm-bar-value">${fmtMoney(val)}</div>
            </div>
          `;
        }).join('')}
      </div>` : ''}
    `;
  }

  function renderSettings() {
    return `
      <div class="fm-section-title">Επιχειρήσεις & Ταμεία</div>
      <div class="fm-card">
        ${state.accounts.length === 0 ? '<div class="fm-empty" style="padding:1rem">Δεν έχεις προσθέσει κανένα ταμείο</div>' :
          state.accounts.map(a => `
            <div class="fm-row">
              <div class="fm-row-left">
                <div class="fm-icon-box" style="background:${a.color}22; color:${a.color}">
                  <i class="ti ti-${a.isPersonal ? 'user' : 'building-store'}"></i>
                </div>
                <div class="fm-row-title">${escapeHtml(a.name)}</div>
              </div>
              <button class="fm-btn-danger" data-del-account="${a.id}"><i class="ti ti-trash"></i></button>
            </div>
          `).join('')
        }
        <button class="fm-btn-secondary" id="add-account-btn" style="width:100%;margin-top:10px"><i class="ti ti-plus"></i> Νέα επιχείρηση/ταμείο</button>
      </div>

      <div class="fm-section-title">Κατηγορίες εξόδων</div>
      <div class="fm-card">
        ${state.categories.expense.map(c => `
          <div class="fm-row">
            <div class="fm-row-left">
              <span class="fm-cat-color" style="background:${c.color}"></span>
              <div class="fm-row-title">${escapeHtml(c.name)}</div>
            </div>
            <button class="fm-btn-danger" data-del-cat="expense:${c.id}"><i class="ti ti-trash"></i></button>
          </div>
        `).join('')}
        <button class="fm-btn-secondary" data-add-cat="expense" style="width:100%;margin-top:10px"><i class="ti ti-plus"></i> Νέα κατηγορία εξόδων</button>
      </div>

      <div class="fm-section-title">Κατηγορίες εσόδων</div>
      <div class="fm-card">
        ${state.categories.income.map(c => `
          <div class="fm-row">
            <div class="fm-row-left">
              <span class="fm-cat-color" style="background:${c.color}"></span>
              <div class="fm-row-title">${escapeHtml(c.name)}</div>
            </div>
            <button class="fm-btn-danger" data-del-cat="income:${c.id}"><i class="ti ti-trash"></i></button>
          </div>
        `).join('')}
        <button class="fm-btn-secondary" data-add-cat="income" style="width:100%;margin-top:10px"><i class="ti ti-plus"></i> Νέα κατηγορία εσόδων</button>
      </div>

      <div class="fm-section-title">Δεδομένα</div>
      <div class="fm-card">
        <button class="fm-btn-secondary" id="export-btn" style="width:100%;margin-bottom:8px"><i class="ti ti-download"></i> Εξαγωγή σε CSV</button>
        <button class="fm-btn-danger" id="reset-btn" style="width:100%;text-align:center;padding:10px;background:var(--color-background-danger);border-radius:var(--border-radius-md)"><i class="ti ti-alert-triangle"></i> Διαγραφή όλων</button>
      </div>
    `;
  }

  function renderModal() {
    if (state.modal === 'addAccount') {
      const usedColors = state.accounts.map(a=>a.color);
      const avail = ACCOUNT_COLORS.filter(c => !usedColors.includes(c));
      const defaultColor = avail[0] || ACCOUNT_COLORS[0];
      return `
        <div class="fm-modal-bg">
          <div class="fm-modal">
            <h3>Νέα επιχείρηση/ταμείο</h3>
            <label class="fm-label">Όνομα</label>
            <input type="text" class="fm-input" id="m-name" placeholder="π.χ. Καφετέρια, Mini Market" />
            <label class="fm-label">Τύπος</label>
            <div class="fm-type-toggle">
              <button class="fm-type-btn" id="m-type-biz" data-isperson="false"><i class="ti ti-building-store"></i> Επιχείρηση</button>
              <button class="fm-type-btn" id="m-type-personal" data-isperson="true"><i class="ti ti-user"></i> Προσωπικό</button>
            </div>
            <label class="fm-label">Χρώμα</label>
            <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px" id="m-colors">
              ${ACCOUNT_COLORS.map(c => `<button data-color="${c}" style="width:32px;height:32px;border-radius:8px;background:${c};border:2px solid ${c===defaultColor?'var(--color-text-primary)':'transparent'};cursor:pointer"></button>`).join('')}
            </div>
            <div style="display:flex;gap:8px">
              <button class="fm-btn-secondary" id="m-cancel" style="flex:1">Άκυρο</button>
              <button class="fm-btn-primary" id="m-save" style="flex:1">Αποθήκευση</button>
            </div>
          </div>
        </div>
      `;
    }
    if (state.modal && state.modal.startsWith('addCat:')) {
      const type = state.modal.split(':')[1];
      const colors = ACCOUNT_COLORS;
      return `
        <div class="fm-modal-bg">
          <div class="fm-modal">
            <h3>Νέα κατηγορία ${type==='expense'?'εξόδων':'εσόδων'}</h3>
            <label class="fm-label">Όνομα</label>
            <input type="text" class="fm-input" id="mc-name" placeholder="π.χ. Διαφήμιση" />
            <label class="fm-label">Χρώμα</label>
            <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px" id="mc-colors">
              ${colors.map((c,i) => `<button data-color="${c}" style="width:32px;height:32px;border-radius:8px;background:${c};border:2px solid ${i===0?'var(--color-text-primary)':'transparent'};cursor:pointer"></button>`).join('')}
            </div>
            <div style="display:flex;gap:8px">
              <button class="fm-btn-secondary" id="mc-cancel" style="flex:1">Άκυρο</button>
              <button class="fm-btn-primary" id="mc-save" style="flex:1">Αποθήκευση</button>
            </div>
          </div>
        </div>
      `;
    }
    return '';
  }

  // ============= HANDLERS =============
  function attachHandlers() {
    document.querySelectorAll('.fm-tab').forEach(btn => {
      btn.onclick = () => { state.activeTab = btn.dataset.tab; render(); };
    });
    document.querySelectorAll('[data-period]').forEach(btn => {
      btn.onclick = () => { state.activePeriod = btn.dataset.period; render(); };
    });
    document.querySelectorAll('[data-type]').forEach(btn => {
      btn.onclick = () => {
        state.form.type = btn.dataset.type;
        state.form.categoryId = '';
        render();
      };
    });

    const fAmount = document.getElementById('f-amount');
    if (fAmount) fAmount.oninput = e => state.form.amount = e.target.value;
    const fAcc = document.getElementById('f-account');
    if (fAcc) fAcc.onchange = e => state.form.accountId = e.target.value;
    const fCat = document.getElementById('f-category');
    if (fCat) fCat.onchange = e => state.form.categoryId = e.target.value;
    const fDate = document.getElementById('f-date');
    if (fDate) fDate.onchange = e => state.form.date = e.target.value;
    const fNote = document.getElementById('f-note');
    if (fNote) fNote.oninput = e => state.form.note = e.target.value;

    const fSave = document.getElementById('f-save');
    if (fSave) fSave.onclick = async () => {
      const amt = parseFloat(state.form.amount);
      if (!amt || amt <= 0) { fSave.textContent = 'Δώσε ποσό!'; setTimeout(()=>render(),1200); return; }
      if (!state.form.accountId || !state.form.categoryId) return;
      state.transactions.push({
        id: uid(),
        type: state.form.type,
        accountId: state.form.accountId,
        categoryId: state.form.categoryId,
        amount: amt,
        note: state.form.note,
        date: state.form.date
      });
      state.form = { type: state.form.type, accountId: state.form.accountId, categoryId: '', amount: '', note: '', date: new Date().toISOString().slice(0,10) };
      await saveState();
      state.activeTab = 'dashboard';
      render();
    };

    const addAcc = document.getElementById('add-account-btn');
    if (addAcc) addAcc.onclick = () => { state.modal = 'addAccount'; render(); };

    document.querySelectorAll('[data-del-account]').forEach(btn => {
      btn.onclick = async () => {
        const id = btn.dataset.delAccount;
        const acc = state.accounts.find(a=>a.id===id);
        if (!confirm(`Διαγραφή του "${acc?.name}" και όλων των κινήσεών του;`)) return;
        state.accounts = state.accounts.filter(a=>a.id!==id);
        state.transactions = state.transactions.filter(t=>t.accountId!==id);
        await saveState();
        render();
      };
    });

    document.querySelectorAll('[data-add-cat]').forEach(btn => {
      btn.onclick = () => { state.modal = 'addCat:' + btn.dataset.addCat; render(); };
    });

    document.querySelectorAll('[data-del-cat]').forEach(btn => {
      btn.onclick = async () => {
        const [type, id] = btn.dataset.delCat.split(':');
        if (!confirm('Διαγραφή κατηγορίας;')) return;
        state.categories[type] = state.categories[type].filter(c=>c.id!==id);
        await saveState();
        render();
      };
    });

    const exportBtn = document.getElementById('export-btn');
    if (exportBtn) exportBtn.onclick = () => {
      const rows = [['Ημ/νία','Τύπος','Επιχείρηση','Κατηγορία','Ποσό','Σημείωση']];
      state.transactions.forEach(t => {
        const acc = state.accounts.find(a=>a.id===t.accountId);
        const cat = (state.categories[t.type]||[]).find(c=>c.id===t.categoryId);
        rows.push([t.date, t.type==='income'?'Έσοδο':'Έξοδο', acc?.name||'', cat?.name||'', t.amount.toString().replace('.',','), t.note||'']);
      });
      const csv = '\uFEFF' + rows.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(';')).join('\n');
      const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'oikonomika_' + new Date().toISOString().slice(0,10) + '.csv';
      a.click(); URL.revokeObjectURL(url);
    };

    const resetBtn = document.getElementById('reset-btn');
    if (resetBtn) resetBtn.onclick = async () => {
      if (!confirm('Είσαι σίγουρος; Θα διαγραφούν ΟΛΑ τα δεδομένα.')) return;
      state.accounts = []; state.transactions = []; state.categories = JSON.parse(JSON.stringify(DEFAULT_CATEGORIES));
      await saveState(); render();
    };
  }

  function attachModalHandlers() {
    if (state.modal === 'addAccount') {
      let selectedColor = ACCOUNT_COLORS.filter(c => !state.accounts.map(a=>a.color).includes(c))[0] || ACCOUNT_COLORS[0];
      let isPersonal = false;
      document.querySelectorAll('#m-colors button').forEach(b => {
        b.onclick = () => {
          selectedColor = b.dataset.color;
          document.querySelectorAll('#m-colors button').forEach(x => x.style.border = '2px solid transparent');
          b.style.border = '2px solid var(--color-text-primary)';
        };
      });
      const bizBtn = document.getElementById('m-type-biz');
      const persBtn = document.getElementById('m-type-personal');
      bizBtn.classList.add('active-income');
      bizBtn.onclick = () => { isPersonal=false; bizBtn.classList.add('active-income'); persBtn.classList.remove('active-income'); };
      persBtn.onclick = () => { isPersonal=true; persBtn.classList.add('active-income'); bizBtn.classList.remove('active-income'); };

      document.getElementById('m-cancel').onclick = () => { state.modal = null; render(); };
      document.getElementById('m-save').onclick = async () => {
        const name = document.getElementById('m-name').value.trim();
        if (!name) return;
        state.accounts.push({ id: uid(), name, color: selectedColor, isPersonal });
        state.modal = null;
        await saveState();
        render();
      };
    }
    if (state.modal && state.modal.startsWith('addCat:')) {
      const type = state.modal.split(':')[1];
      let selectedColor = ACCOUNT_COLORS[0];
      document.querySelectorAll('#mc-colors button').forEach(b => {
        b.onclick = () => {
          selectedColor = b.dataset.color;
          document.querySelectorAll('#mc-colors button').forEach(x => x.style.border = '2px solid transparent');
          b.style.border = '2px solid var(--color-text-primary)';
        };
      });
      document.getElementById('mc-cancel').onclick = () => { state.modal = null; render(); };
      document.getElementById('mc-save').onclick = async () => {
        const name = document.getElementById('mc-name').value.trim();
        if (!name) return;
        state.categories[type].push({ id: uid(), name, color: selectedColor });
        state.modal = null;
        await saveState();
        render();
      };
    }
  }

  function escapeHtml(s) {
    return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // Initialize
  loadState().then(render);
})();
</script>
